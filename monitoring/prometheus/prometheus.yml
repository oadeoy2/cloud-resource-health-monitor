global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['44.200.0.130:8080']
    basic_auth:
      username: 'admin'
      password: 'password123'

  - job_name: 'grafana'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['10.0.1.11:3000']
